<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toomuchsalad - 3D Apparel Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0b0e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 800;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            margin: 0;
            font-size: 13px;
            color: #aaa;
        }
        .controls-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 24px;
            border-radius: 30px;
            display: flex;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }
        button {
            background: #2a2a35;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #ff758c;
            color: #fff;
            transform: translateY(-2px);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="ui-overlay">
        <h1>toomuchsalad</h1>
        <p>Interactive 3D Apparel Viewer • Drag to Rotate</p>
    </div>
    <div class="controls-panel">
        <button onclick="resetCamera()">Reset</button>
        <button onclick="toggleOutfit()">Toggle</button>
        <button onclick="changeColor()">Colorway</button>
    </div>
    <div id="canvas-container"></div>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0b0b0e, 0.05);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xfff5f8, 1.2);
        dirLight.position.set(5, 8, 5);
        scene.add(dirLight);

        const outfitGroup = new THREE.Group();
        scene.add(outfitGroup);

        let hoodieMat = new THREE.MeshStandardMaterial({ color: 0xff85a2, roughness: 0.85 });
        let shortsMat = new THREE.MeshStandardMaterial({ color: 0x9e9e9e, roughness: 0.9 });

        const hoodieGroup = new THREE.Group();
        hoodieGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.0, 1.8, 32), hoodieMat)).position.y = 0.6;
        hoodieGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.65, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.6), hoodieMat)).position.set(0, 1.6, -0.1);
        
        const leftSleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.25, 1.6, 16), hoodieMat);
        leftSleeve.position.set(1.1, 1.0, 0); leftSleeve.rotation.z = -Math.PI / 4;
        hoodieGroup.add(leftSleeve);

        const rightSleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.25, 1.6, 16), hoodieMat);
        rightSleeve.position.set(-1.1, 1.0, 0); rightSleeve.rotation.z = Math.PI / 4;
        hoodieGroup.add(rightSleeve);

        const shortsGroup = new THREE.Group();
        shortsGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.75, 1.3, 32), shortsMat)).position.set(0.45, -0.8, 0);
        shortsGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.75, 1.3, 32), shortsMat)).position.set(-0.45, -0.8, 0);

        outfitGroup.add(hoodieGroup);
        outfitGroup.add(shortsGroup);
        outfitGroup.position.y = -0.2;

        function resetCamera() { controls.reset(); camera.position.set(0, 1, 6); }
        let state = 0;
        function toggleOutfit() {
            state = (state + 1) % 3;
            hoodieGroup.visible = (state !== 2);
            shortsGroup.visible = (state !== 1);
        }
        let col = 0;
        function changeColor() {
            col = (col + 1) % 2;
            hoodieMat.color.setHex(col === 0 ? 0xff85a2 : 0x3a506b);
            shortsMat.color.setHex(col === 0 ? 0x9e9e9e : 0x222222);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
